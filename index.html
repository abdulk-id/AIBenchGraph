<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>AIBenchGraph</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <header>
            <nav class="tabs" id="tabs"></nav>
            <div class="tools">
                <input type="search" id="search" placeholder="Find models" autocomplete="off" spellcheck="false" />
                <label class="check"><input type="checkbox" id="pareto" checked /><span>Pareto line</span></label>
                <div class="seg">
                    <button type="button" id="scaleLog" class="on">Log</button>
                    <button type="button" id="scaleLinear">Linear</button>
                </div>
                <button type="button" id="addBtn" class="add-btn">+ Model</button>
            </div>
        </header>

        <form class="add-panel" id="addPanel" hidden>
            <div class="ap-head">
                <span id="apTitle">Add model</span>
                <button type="button" id="addClose" class="ap-x" title="Close">&times;</button>
            </div>

            <div class="ap-field"><span>Name</span><input id="apName" type="text" placeholder="Claude Opus 5.5" autocomplete="off" /></div>
            <div class="ap-field"><span>Provider</span><input id="apProvider" type="text" placeholder="Anthropic (optional)" autocomplete="off" /></div>

            <div class="ap-cols"><span>effort</span><span>score</span><span>cost / task</span><span></span></div>
            <div id="apRows"></div>
            <button type="button" id="apAddRow" class="ap-ghost ap-rowadd">+ another effort level</button>

            <p class="ap-err" id="apErr" hidden></p>

            <div class="ap-actions">
                <button type="button" id="apCancel" class="ap-ghost">Cancel</button>
                <button type="submit" class="ap-primary">Add model</button>
            </div>

            <div class="ap-local" id="apLocal" hidden>
                <div class="ap-local-head">added in this browser</div>
                <div id="apLocalList"></div>
                <div class="ap-local-actions">
                    <button type="button" id="apExport" class="ap-ghost">Download data/models.js</button>
                    <button type="button" id="apClear" class="ap-ghost">Clear all</button>
                </div>
            </div>
        </form>

        <div class="work">
<main id="chart"></main>
<aside class="side">
<div class="side-head">
<span id="sideCount">Models</span>
<button type="button" id="sideToggle">hide all</button>
</div>
<div class="side-list" id="sideList"></div>
</aside>
</div>

        <footer>
            <span id="note"></span>
            <a id="src" target="_blank" rel="noreferrer"></a>
        </footer>

        <div id="tip" class="tip"></div>

        <script src="data/models.js"></script>
        <script src="js/data.js"></script>
        <script src="js/scale.js"></script>
        <script src="js/chart.js"></script>
        <script src="js/app.js"></script>
    </body>
</html>
